# Render Blueprint — one free Web Service hosts API + built React UI together.
# Dashboard: New → Blueprint → connect this repo → apply.
# Do NOT put secrets in this file.

services:
  - type: web
    name: documind
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    # --include=dev is required: Vite/TypeScript/Prisma CLI live in devDependencies.
    # Do NOT set NODE_ENV=production as a service env var (it makes `npm install` skip devDeps).
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        # Relative to server/prisma/ (free tier disk is ephemeral)
        value: file:./prod.db
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_FILE_SIZE_BYTES
        value: "10485760"
